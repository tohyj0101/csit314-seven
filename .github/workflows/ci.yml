name: CI

on:
  push:
    branches: [ main, 'sprint-*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: csit314_seven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: csit314_seven_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pgsql
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Apply database schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d csit314_seven_test -f db/schema.sql

      - name: Seed database
        run: php db/seed.php

      - name: Run test suite
        run: vendor/bin/phpunit --testdox